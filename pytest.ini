[pytest]
testpaths = tests
# Strict markers and a default deselection (the repo-root plugin sar_f0_plugin.py, loaded by -p; not a
# root conftest.py, which would shadow the ported u6 tests' bare `import conftest`). Public copy: the
# default run works on any machine; the four markers below are opt-in with -m.
#   ssd       reads the OpenAlex extraction (ssd_root; set SAR_SSD_ROOT and SAR_DISK_TESTS=1)
#   estimate  runs Rscript estimation on frames
#   legacy    reads the author's private legacy trees (not shipped)
#   live      calls a live web API
# depends_on_u and slow are the ported units' own markers, declared so --strict-markers accepts them.
addopts = -p sar_f0_plugin --import-mode=importlib --strict-markers -m "not ssd and not estimate and not legacy and not live"
markers =
    ssd: reads the external data disk (ssd_root)
    estimate: runs Rscript estimation on frames
    legacy: reads the read-only legacy trees heavily
    live: calls a live web API
    depends_on_u: ported unit marker (pipeline/units)
    slow: ported unit marker (pipeline/units)
# The ported unit tests import siblings by bare name, and importlib mode does not put the test
# directory on sys.path. That is done here rather than by a conftest.py inside the port, so the
# port needs no auto-executed file of its own (T2-review F1).
# u6_assemble comes FIRST: it is the only unit doing a bare `import conftest`.
pythonpath =
    pipeline/units/u6_assemble/tests
    pipeline/units/u0_foundation/tests
    pipeline/units/u0p5_dept_roster/tests
    pipeline/units/u0p5_hist_raw/tests
    pipeline/units/u1_fetch/tests
    pipeline/units/u2_resolve/tests
    pipeline/units/u3_panel/tests
    pipeline/units/u4_output_star/tests
    pipeline/units/u5_dose/tests
